<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion - PRINCE X KAIRO MOVIE</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #050505;
  color: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.top-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 24px 20px 8px;
}

.logo {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 8px;
  background: #000;
  border: 2px solid #e50914;
  color: #e50914;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 1px;
}

.top-brand h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: 1px;
  color: #e50914;
}

.top-brand h1 span {
  color: #f5f5f5;
}

.auth-wrap {
  width: 100%;
  max-width: 400px;
  padding: 30px 24px 60px;
}

.auth-card {
  background: #101010;
  border: 1px solid #262626;
  border-radius: 14px;
  padding: 32px 26px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.auth-card h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.7rem;
  letter-spacing: 1px;
  margin-bottom: 6px;
  color: #fff;
}

.auth-card .sub {
  color: #8a8a8a;
  font-size: 0.9rem;
  margin-bottom: 26px;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.8rem;
  color: #b0b0b0;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

.field input {
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 8px;
  border: 1px solid #2c2c2c;
  background: #171717;
  color: #f5f5f5;
  font-size: 0.95rem;
}

.field input::placeholder {
  color: #5c5c5c;
}

.field input:focus {
  outline: none;
  border-color: #e50914;
  box-shadow: 0 0 0 4px rgba(229,9,20,0.15);
}

.error-msg {
  color: #ff5c5c;
  font-size: 0.78rem;
  margin-top: 5px;
  display: none;
}

.submit-btn {
  width: 100%;
  padding: 0.95rem;
  border-radius: 8px;
  border: none;
  background: #e50914;
  color: #fff;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.4px;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 20px rgba(229,9,20,0.35);
  transition: background 0.2s ease, transform 0.15s ease;
}

.submit-btn:hover {
  background: #ff0a16;
  transform: translateY(-1px);
}

.switch-line {
  text-align: center;
  margin-top: 20px;
  font-size: 0.85rem;
  color: #8a8a8a;
}

.switch-line a {
  color: #e50914;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>

  <div class="top-brand">
    <div class="logo">PK</div>
    <h1>PRINCE X KAIRO <span>MOVIE</span></h1>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Se connecter</h2>
      <p class="sub">Content de te revoir</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="toi@exemple.com" />
          <div class="error-msg" id="err-email">Entre une adresse email valide.</div>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" />
          <div class="error-msg" id="err-password">Entre ton mot de passe.</div>
        </div>

        <div class="error-msg" id="err-global" style="text-align:center; margin-top:4px;"></div>

        <button type="submit" class="submit-btn">Se connecter</button>
      </form>

      <p class="switch-line">Pas encore inscrit ? <a href="inscription.html">Créer un compte</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      let valid = true;
      const globalErr = document.getElementById('err-global');
      globalErr.style.display = 'none';
      globalErr.textContent = '';

      const fields = [
        { id: 'email', err: 'err-email', check: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) },
        { id: 'password', err: 'err-password', check: (v) => v.length > 0 },
      ];

      fields.forEach(f => {
        const input = document.getElementById(f.id);
        const errEl = document.getElementById(f.err);
        if (!f.check(input.value)) {
          errEl.style.display = 'block';
          valid = false;
        } else {
          errEl.style.display = 'none';
        }
      });

      if (!valid) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const raw = localStorage.getItem('pkm_user');

      if (!raw) {
        globalErr.textContent = "Aucun compte trouvé. Inscris-toi d'abord.";
        globalErr.style.display = 'block';
        return;
      }

      const u = JSON.parse(raw);
      if (u.email !== email || u.password !== password) {
        globalErr.textContent = "Email ou mot de passe incorrect.";
        globalErr.style.display = 'block';
        return;
      }

      localStorage.setItem('pkm_logged_in', 'true');
      window.location.href = 'index.html';
    });
  </script>

</body>
  </html>
