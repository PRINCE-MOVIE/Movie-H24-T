<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inscription - PRINCE X KAIRO MOVIE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #050505;
  color: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.top-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 24px 20px 8px;
}

.logo {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 8px;
  background: #000;
  border: 2px solid #e50914;
  color: #e50914;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 1px;
}

.top-brand h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: 1px;
  color: #e50914;
}

.top-brand h1 span {
  color: #f5f5f5;
}

.auth-wrap {
  width: 100%;
  max-width: 400px;
  padding: 30px 24px 60px;
}

.auth-card {
  background: #101010;
  border: 1px solid #262626;
  border-radius: 14px;
  padding: 32px 26px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.auth-card h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.7rem;
  letter-spacing: 1px;
  margin-bottom: 6px;
  color: #fff;
}

.auth-card .sub {
  color: #8a8a8a;
  font-size: 0.9rem;
  margin-bottom: 26px;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.8rem;
  color: #b0b0b0;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

.field input {
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 8px;
  border: 1px solid #2c2c2c;
  background: #171717;
  color: #f5f5f5;
  font-size: 0.95rem;
}

.field input::placeholder {
  color: #5c5c5c;
}

.field input:focus {
  outline: none;
  border-color: #e50914;
  box-shadow: 0 0 0 4px rgba(229,9,20,0.15);
}

.error-msg {
  color: #ff5c5c;
  font-size: 0.78rem;
  margin-top: 5px;
  display: none;
}

.submit-btn {
  width: 100%;
  padding: 0.95rem;
  border-radius: 8px;
  border: none;
  background: #e50914;
  color: #fff;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.4px;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 20px rgba(229,9,20,0.35);
  transition: background 0.2s ease, transform 0.15s ease;
}

.submit-btn:hover {
  background: #ff0a16;
  transform: translateY(-1px);
}

.switch-line {
  text-align: center;
  margin-top: 20px;
  font-size: 0.85rem;
  color: #8a8a8a;
}

.switch-line a {
  color: #e50914;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>

  <div class="top-brand">
    <div class="logo">PK</div>
    <h1>PRINCE X KAIRO <span>MOVIE</span></h1>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Créer un compte</h2>
      <p class="sub">Rejoins PRINCE X KAIRO MOVIE en quelques secondes</p>

      <form id="signupForm">
        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" placeholder="Ton nom" />
          <div class="error-msg" id="err-nom">Entre ton nom.</div>
        </div>

        <div class="field">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" placeholder="Ton prénom" />
          <div class="error-msg" id="err-prenom">Entre ton prénom.</div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="toi@exemple.com" />
          <div class="error-msg" id="err-email">Entre une adresse email valide.</div>
        </div>

        <div class="field">
          <label for="tel">Numéro de téléphone</label>
          <input type="tel" id="tel" placeholder="+509 00 00 0000" />
          <div class="error-msg" id="err-tel">Entre ton numéro de téléphone.</div>
        </div>

        <button type="submit" class="submit-btn">S'inscrire</button>
      </form>

      <p class="switch-line">Déjà inscrit ? <a href="#">Se connecter</a></p>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      let valid = true;

      const fields = [
        { id: 'nom', err: 'err-nom', check: (v) => v.trim().length > 0 },
        { id: 'prenom', err: 'err-prenom', check: (v) => v.trim().length > 0 },
        { id: 'email', err: 'err-email', check: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) },
        { id: 'tel', err: 'err-tel', check: (v) => v.trim().length >= 6 },
      ];

      fields.forEach(f => {
        const input = document.getElementById(f.id);
        const errEl = document.getElementById(f.err);
        if (!f.check(input.value)) {
          errEl.style.display = 'block';
          valid = false;
        } else {
          errEl.style.display = 'none';
        }
      });

      if (valid) {
        const userData = {
          nom: document.getElementById('nom').value.trim(),
          prenom: document.getElementById('prenom').value.trim(),
          email: document.getElementById('email').value.trim(),
          tel: document.getElementById('tel').value.trim(),
        };
        localStorage.setItem('pkm_user', JSON.stringify(userData));
        window.location.href = 'apercu8.html';
      }
    });
  </script>

</body>
                                    </html>
